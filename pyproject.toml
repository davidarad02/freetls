[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freetls"
version = "0.0.1"
description = "HTTPS/TLS client with controllable JA4 (TLS client fingerprint)"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["tls", "ja3", "ja4", "fingerprint", "https", "utls", "tls-client"]
authors = [{ name = "freetls contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Go",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cffi>=1.15"]

[project.urls]
Homepage = "https://github.com/freetls/freetls"
Issues = "https://github.com/freetls/freetls/issues"

[project.optional-dependencies]
http = ["requests>=2.28", "urllib3>=2.0"]
async = ["httpx>=0.24", "aiohttp>=3.8"]
pki = ["cryptography>=41"]
content = ["brotli>=1.1", "zstandard>=0.22"]
dev = ["ruff>=0.6", "black>=24", "mypy>=1.10"]
test = ["pytest>=7", "pytest-cov>=4", "scapy>=2.5", "requests>=2.28", "httpx>=0.24", "aiohttp>=3.8", "cryptography>=41", "brotli>=1.1", "zstandard>=0.22"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"freetls" = ["py.typed"]
"freetls.fingerprint.tables" = ["*.json"]
"freetls.profiles" = ["*.json"]
"freetls._lib" = ["*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: end-to-end tests that start a local TLS server",
    "pcap: tests that capture loopback traffic (require a capability-bearing tcpdump)",
]

[tool.coverage.run]
source = ["freetls"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["native", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
files = ["src/freetls"]

[tool.ruff.lint.per-file-ignores]
# Tests insert the tests dir on sys.path before importing helpers, and assert
# on broad exceptions from cryptography.
"tests/**" = ["E402", "B017"]
